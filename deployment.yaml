apiVersion: apps/v1
kind: Deployment
metadata:
  name: livros-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livros-api
  template:
    metadata:
      labels:
        app: livros-api
    spec:
      containers:
        - name: livros-api
          image: livros-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: "sqlite:///./livros.db"
            - name: MEU_USUARIO
              value: "lucas"
            - name: MINHA_SENHA
              value: "123456"