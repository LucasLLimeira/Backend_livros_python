input {
    file{
        path => "/logs/app.log"
        start_position => "end"
        sincedb_path => "/usr/share/logstash/data/.sincedb_livros"
    }
}

filter {
    json {
        source => "message"
    }

    if "_jsonparsefailure" in [tags] {
        grok {
            match => {
                "message" => [
                    "%{TIMESTAMP_ISO8601:log_timestamp} %{LOGLEVEL:level} %{GREEDYDATA:log_message}",
                    "%{TIMESTAMP_ISO8601:log_timestamp} \[%{DATA:logger}\] %{LOGLEVEL:level} %{GREEDYDATA:log_message}",
                    "%{TIMESTAMP_ISO8601:log_timestamp} %{GREEDYDATA:log_message}"
                ]
            }
            tag_on_failure => ["_grokparsefailure"]
        }

        if "_grokparsefailure" in [tags] {
            drop { }
        }
    }

    if [timestamp] {
        date {
            match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss,SSS", "yyyy-MM-dd HH:mm:ss"]
            target => "@timestamp"
        }
    } else if [log_timestamp] {
        date {
            match => ["log_timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss,SSS", "yyyy-MM-dd HH:mm:ss"]
            target => "@timestamp"
        }
    }

    mutate {
        remove_field => ["message", "event", "host", "log", "@version", "tags", "timestamp", "log_timestamp"]
    }
}

output {
    elasticsearch{
        hosts => ["http://elasticsearch:9200"]
        index => "livros-logs"
    }
    stdout{
        codec => rubydebug
    }
}