version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: livros_redis
    ports:
      - "6379:6379"

  celery:
    build: .
    container_name: livros_celery
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    command: ["poetry", "run", "celery", "-A", "celery_app:celery_app", "worker", "-Q", "livros", "--loglevel=info"]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  app:
    build: .
    container_name: livros_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    command: ["poetry", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure